template-columns:minmax(0,1fr) 272px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:var(--shadow);overflow:hidden;min-height:490px}.viz-panel{position:relative;padding:20px;min-width:0;background:radial-gradient(ellipse at 40% 45%,#fbfcf7,#f0f5ef);display:flex;flex-direction:column;justify-content:center}.viz-panel svg{display:block;width:100%;height:auto;min-width:0;overflow:visible;font-family:inherit}.viz-heading{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);letter-spacing:.6px;margin-bottom:8px}.live-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--teal);margin-right:6px}.controls{padding:23px 22px;border-left:1px solid var(--line);background:#fff;min-width:0}.controls h3{margin:0 0 21px;font-size:14px}.control{margin-bottom:21px}.control label{display:block;font-weight:650;font-size:12px;margin-bottom:7px}.control label output,.control label b{float:right;color:var(--teal);font-variant-numeric:tabular-nums}.control input[type=range]{width:100%;accent-color:var(--teal);height:22px;cursor:pointer}.control select,.control input[type=number]{width:100%;border:1px solid var(--line);background:var(--paper);padding:9px 11px;border-radius:7px;color:var(--ink);font-size:13px}.control small{font-size:10px;display:block;color:var(--muted)}.readouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:15px}.readout{border:1px solid var(--line);border-radius:9px;padding:11px 10px;background:#f8faf5;font-size:11px;color:var(--muted);min-width:0}.readout b,.readout strong{display:block;color:var(--ink);font-size:19px;line-height:1.4;font-weight:650}.note{font-size:12px;line-height:1.8;color:var(--muted);margin:14px 0 0;padding:12px 14px;background:#f4f7ef;border-radius:8px}.note b{color:var(--ink)}.chip{display:inline-block;border:1px solid var(--line);border-radius:20px;font-size:11px;padding:5px 10px;background:#fff;margin:3px 3px 3px 0;curs <script>/* Self-contained, dependency-free junior-high optics laboratory. */
(function () {
  'use strict';
  const C={object:'#ffcc6a',image:'#bb9bff',ray:'#61ddeb',second:'#ff92bc',muted:'#a6b5cd',ink:'#eaf3ff'};
  const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
  function snell(n1,n2,a){const q=n1*Math.sin(rad(a))/n2;return {tir:q>1+1e-12,angle:q>1+1e-12?null:deg(Math.asin(Math.min(1,Math.max(-1,q)))),critical:n1>n2?deg(Math.asin(n2/n1)):null};}
  function shadow(a,D,h){return {m:D/a,height:h*D/a};}
  function lens(f,u){if(Math.abs(u-f)<1e-9)return {v:null,m:null,infinity:true};const v=f*u/(u-f);return {v,m:-v/u,infinity:false};}
  const num=(n,d=1)=>Number.isFinite(n)?n.toFixed(d):'—';
  const text=(x,y,s,fill=C.ink,size=20,anchor='start')=>`<text x="${x}" y="${y}" fill="${fill}" font-size="${size}" text-anchor="${anchor}">${s}</text>`;
  const line=(x1,y1,x2,y2,c=C.ray,dash=false,w=3,arrow=false)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${dash?'stroke-dasharray="9 7"':''} ${arrow?'marker-end="url(#optic-arrow)"':''}/>`;
  const arrow=(x,y0,y1,c,dash=false)=>line(x,y0,x,y1,c,dash,5)+`<path d="M ${x-9} ${y1+(y1<y0?15:-15)} L ${x} ${y1} L ${x+9} ${y1+(y1<y0?15:-15)}" fill="none" stroke="${c}" stroke-width="4"/>`;
  const read=(label,value)=>`<div class="readout"><span>${label}</span><strong>${value}</strong></div>`;
  const range=(key,label,value,min,max,step,unit)=>`<div class="control"><label for="optic-${key}">${label} <output data-value="${key}">${value}${unit}</output></label><input id="optic-${key}" data-key="${key}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" aria-label="${label}" data-unit="${unit}"/></div>`;
  const question=(q,a)=>`<details class="question"><summary>先預測：${q}</summary><p>${a}</p></details>`;
  function svg(content,label){return `<svg viewBox="0 0 900 500" role="img" aria-label="${label}" style="display:block;width:100%;height:auto;background:#101c31;border-radius:16px;font-family:inherit"><defs><marker id="optic-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker><clipPath id="optic-clip"><rect x="15" y="15" width="870" height="450"/></clipPath></defs>${content}</svg>`;}
  function mount(host,topic){
    const state={d:55,h:65,n1:1,n2:1.5,a:40,f:80,u:200,type:1,r:255,g:255,b:0,sa:60,sd:200,sh:40};
    let controls='',q='';
    if(topic==='shadow'){controls=range('sa','光源到物體 a',60,20,100,1,' cm')+range('sd','光源到屏幕 D',200,120,300,1,' cm')+range('sh','物體高度 h',40,5,60,1,' cm');q=question('物體靠近點光源，屏幕上的影子會變大還是變小？','會變大。屏幕位置不變時，光源到物體的距離 a 減少，影子的放大倍數 D/a 增加。這裡使用點光源，因此影子邊界清楚，沒有半影。');}
    else if(topic==='mirror'){controls=range('d','物體離鏡距離',55,15,100,1,' cm')+range('h','物體高度',65,20,100,1,' cm');q=question('物體向鏡面靠近 10 cm，物與像的距離改變多少？','像也向鏡面靠近 10 cm，所以物與像的距離減少 20 cm。平面鏡像與物體到鏡面的距離相等。');}
    else if(topic==='refraction'){controls=range('n1','入射介質折射率 n₁',1,1,2.5,.01,'')+range('n2','透射介質折射率 n₂',1.5,1,2.5,.01,'')+range('a','入射角 θ₁（從法線量起）',40,0,89,1,'°');q=question('光由水射向空氣，一定會折射出去嗎？','不一定。由高折射率介質射向低折射率介質時，入射角大於臨界角，就發生全反射。臨界角時折射方向沿著界面。');}
    else if(topic==='lens'){controls=`<div class="control"><label for="optic-type">透鏡種類</label><select id="optic-type" data-key="type"><option value="1">凸透鏡（會聚）</option><option value="-1">凹透鏡（發散）</option></select></div>`+range('f','焦距大小 |f|',80,40,140,1,' cm')+range('u','物距 u',200,20,360,.5,' cm')+`<div class="control"><span>凸透鏡關鍵位置</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${[['2.5','u > 2f'],['2','u = 2f'],['1.5','f < u < 2f'],['1','u = f'],['0.5','u < f']].map(([v,t])=>`<button type="button" class="btn" data-preset="${v}" style="font-size:13px">${t}</button>`).join('')}</div></div>`;q=question('凸透鏡的物體放在焦點內，像能接在屏幕上嗎？','不能。射出光線發散，只有反向延長線相交，形成正立放大的虛像；屏幕接不到虛像。物體恰在焦點上時，射出光線平行，沒有有限距離的像。');}
    else {topic='color';controls=range('r','紅光 R',255,0,255,1,'')+range('g','綠光 G',255,0,255,1,'')+range('b','藍光 B',0,0,255,1,'')+`<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" type="button" data-color="white">白光</button><button class="btn" type="button" data-color="yellow">黃光</button><button class="btn" type="button" data-color="cyan">青光</button><button class="btn" type="button" data-color="magenta">洋紅光</button><button class="btn" type="button" data-color="off">關燈</button></div>`;q=question('紅光和綠光相加，會變成哪種光？','等強度的紅光與綠光相加是黃光；再加等強度藍光可得到白光。這是光的加色混合，顏料或濾色片的減色混合不能套用同一規則。');}
    host.innerHTML=`<div class="sim-layout"><div class="viz-panel"><div data-drawing></div><p class="note" data-note></p></div><div class="controls">${controls}<div class="readouts" data-reads></div></div></div>${q}`;
    const drawing=host.querySelector('[data-drawing]'),reads=host.querySelector('[data-reads]'),note=host.querySelector('[data-note]');
    function render(){let art='',info='',explain='';
      host.querySelectorAll('[data-key]').forEach(el=>{el.value=state[el.dataset.key];const out=host.querySelector(`[data-value="${el.dataset.key}"]`);if(out)out.textContent=state[el.dataset.key]+el.dataset.unit;});
      if(topic==='shadow'){
        const z=shadow(state.sa,state.sd,state.sh),sy=Math.min(3,350/z.height),ox=100+700*state.sa/state.sd,ot=250-state.sh*sy/2,ob=250+state.sh*sy/2,st=250-z.height*sy/2,sb=250+z.height*sy/2;
        art=`<rect x="790" y="35" width="18" height="400" rx="4" fill="#708399"/><path d="M ${ox} ${ot} L800 ${st} L800 ${sb} L${ox} ${ob} Z" fill="#05080d"/>`+line(100,250,800,250,C.muted,true,2)+line(100,250,ox,ot,C.ray,false,3,true)+line(ox,ot,800,st,C.ray,false,3,true)+line(100,250,ox,ob,C.ray,false,3,true)+line(ox,ob,800,sb,C.ray,false,3,true)+line(ox,ot,ox,ob,C.object,false,10)+line(799,st,799,sb,C.image,false,10)+`<circle cx="100" cy="250" r="11" fill="#ffe8a5"/><circle cx="100" cy="250" r="23" fill="none" stroke="#ffe8a5" opacity=".35"/>`+text(100,210,'點光源',C.object,22,'middle')+text(ox,ot-18,'不透明物體',C.object,21,'middle')+text(810,30,'屏幕',C.ink,21,'middle')+text(820,250,'影子',C.image,22)+line(100,448,ox,448,C.object,true,2)+text((100+ox)/2,439,`a = ${state.sa} cm`,C.object,19,'middle')+line(100,481,800,481,C.muted,true,2)+text(450,475,`D = ${state.sd} cm`,C.muted,19,'middle');
        info=read('物體高度 h',`${state.sh} cm`)+read('影子高度 H',`${num(z.height)} cm`)+read('放大倍數 H/h',`${num(z.m,2)} 倍`)+read('相似三角形','H / h = D / a');explain='光在均勻介質中沿直線傳播。不透明物體擋住部分光，形成影子；兩條邊界光線由點光源出發，剛好經過物體兩端。固定屏幕時，物體越靠近光源，影子越大。這是點光源模型，沒有半影；圖的水平與垂直顯示比例可能不同，但物體與影子的高度比例正確。';
      } else if(topic==='mirror'){
        const mx=450,ox=mx-state.d*3,ix=mx+state.d*3,base=365,top=base-state.h*2,ex=100,ey=100;
        art=`<rect x="450" y="45" width="12" height="380" fill="#72dbe6" opacity=".35"/>`+line(mx,45,mx,425,C.ray,false,4)+text(mx,30,'平面鏡',C.ray,20,'middle');
        [top,base].forEach((y,i)=>{const hit=ey+(y-ey)*(mx-ex)/(ix-ex);art+=line(ox,y,mx,hit,i?C.second:C.ray,false,3,true)+line(mx,hit,ex,ey,i?C.second:C.ray,false,3,true)+line(mx,hit,ix,y,i?C.second:C.ray,true,2);});
        art+=arrow(ox,base,top,C.object)+arrow(ix,base,top,C.image,true)+text(ox,base+30,'物',C.object,24,'middle')+text(ix,base+30,'虛像',C.image,24,'middle');
        art+=`<path d="M 69 100 Q 100 71 131 100 Q 100 129 69 100" fill="#e8f3ff"/><circle cx="100" cy="100" r="11" fill="#162b46"/>`+text(65,60,'眼睛',C.ink,20)+line(ox,435,mx,435,C.object,true,2)+line(mx,435,ix,435,C.image,true,2)+text((ox+mx)/2,468,`${state.d} cm`,C.object,20,'middle')+text((ix+mx)/2,468,`${state.d} cm`,C.image,20,'middle');
        info=read('物距 = 像距',`${state.d} cm`)+read('物與像距離',`${state.d*2} cm`)+read('像的高度',`${state.h} cm`)+read('像的性質','正立・等大・虛像');explain='實線是光走的路徑，虛線是反射光的反向延長線。像在鏡後，光沒有真正穿過鏡子。鏡像把垂直鏡面的前後方向反轉；常見的「左右相反」來自把鏡像與轉身後的自己比較。';
      } else if(topic==='refraction'){
        const z=snell(state.n1,state.n2,state.a),cx=450,cy=250,L=205,a=rad(state.a);
        art=`<rect x="20" y="30" width="860" height="220" fill="#1d3854"/><rect x="20" y="250" width="860" height="225" fill="#244c66"/>`+line(20,cy,880,cy,'#d7edff',false,2)+line(cx,35,cx,470,C.muted,true,2)+text(470,50,'法線',C.muted)+text(40,65,`介質 1：n₁ = ${num(state.n1,2)}`)+text(40,450,`介質 2：n₂ = ${num(state.n2,2)}`)+line(cx-L*Math.sin(a),cy-L*Math.cos(a),cx,cy,C.object,false,4,true)+line(cx,cy,cx+L*Math.sin(a),cy-L*Math.cos(a),C.second,false,4,true);
        const arc=(r,start,end,c)=>`<path d="M ${cx+r*Math.cos(start)} ${cy+r*Math.sin(start)} A ${r} ${r} 0 0 1 ${cx+r*Math.cos(end)} ${cy+r*Math.sin(end)}" fill="none" stroke="${c}" stroke-width="2"/>`;
        if(state.a>0)art+=arc(65,-Math.PI/2-a,-Math.PI/2,C.object)+arc(90,-Math.PI/2,-Math.PI/2+a,C.second);
        art+=text(250,110,`入射 ${state.a}°`,C.object,21)+text(590,110,`反射 ${state.a}°`,C.second,21);
        if(!z.tir){const b=rad(z.angle);art+=line(cx,cy,cx+L*Math.sin(b),cy+L*Math.cos(b),C.ray,false,4,true);if(z.angle>0)art+=arc(70,Math.PI/2-b,Math.PI/2,C.ray);art+=text(590,365,`折射 ${num(z.angle)}°`,C.ray,21);}else art+=text(590,365,'全反射：無折射光',C.object,24);
        info=read('反射角',`${state.a}°`)+read('折射角',z.tir?'無折射光':`${num(z.angle)}°`)+read('臨界角',z.critical===null?'此方向不會全反射':`${num(z.critical)}°`)+read('關係式','n₁ sin θ₁ = n₂ sin θ₂');explain='所有角度都從法線量起。進入較高折射率介質，折射光偏向法線；進入較低折射率介質則偏離法線。僅當 n₁ > n₂ 且入射角大於臨界角時會全反射。圖中的光線粗細不代表能量比例。';
      } else if(topic==='lens'){
        const f=state.type*state.f,u=state.u,z=lens(f,u),outside=!z.infinity&&Math.abs(z.v)>1800;
        const extent=Math.max(u,2*state.f,(!z.infinity&&!outside?Math.abs(z.v):0),160),s=Math.min(380/extent,145/(30*Math.max(1,!z.infinity&&!outside?Math.abs(z.m):1))),cx=450,cy=255,X=x=>cx+x*s,Y=y=>cy-y*s,oh=30;
        art=line(25,cy,875,cy,C.muted,true,2)+text(875,cy-12,'主軸',C.muted,16,'end');
        for(const sign of [-1,1])for(const mult of [1,2]){const x=X(sign*mult*state.f);art+=line(x,cy-6,x,cy+6,C.muted,false,2)+text(x,cy+28,`${mult===2?'2':''}F`,C.muted,16,'middle');}
        art+=state.type===1?`<path d="M450 65 Q487 255 450 445 Q413 255 450 65" fill="#61ddeb22" stroke="${C.ray}" stroke-width="3"/>`:`<path d="M428 65 Q460 255 428 445 L472 445 Q440 255 472 65 Z" fill="#61ddeb22" stroke="${C.ray}" stroke-width="3"/>`;
        const end=430/s;
        art+='<g clip-path="url(#optic-clip)">'+line(X(-u),Y(oh),cx,Y(oh),C.ray,false,3,true)+line(cx,Y(oh),X(end),Y(oh-oh*end/f),C.ray,false,3,true)+line(X(-u),Y(oh),cx,cy,C.second,false,3,true)+line(cx,cy,X(end),Y(-oh*end/u),C.second,false,3,true);
        if(!z.infinity&&z.v<0){art+=line(cx,Y(oh),X(z.v),Y(z.m*oh),C.ray,true,2)+line(cx,cy,X(z.v),Y(z.m*oh),C.second,true,2);}
        if(!z.infinity&&!outside)art+=arrow(X(z.v),cy,Y(z.m*oh),C.image,z.v<0);
        art+=arrow(X(-u),cy,Y(oh),C.object)+'</g>'+text(X(-u),Y(oh)-15,'物',C.object,22,'middle');
        if(!z.infinity&&!outside)art+=text(X(z.v),Y(z.m*oh)+(z.m<0?30:-17),z.v>0?'實像':'虛像',C.image,22,'middle');
        if(z.infinity)art+=text(450,475,'物體在焦點：出射光平行，沒有有限像距',C.object,22,'middle');else if(outside)art+=text(450,475,'像超出目前視野；請查看右側像距',C.image,22,'middle');else art+=text(450,475,'實線：實際光路　　虛線：反向延長線',C.muted,18,'middle');
        const property=z.infinity?'無有限距離的像':`${z.v>0?'實像・倒立':'虛像・正立'}・${Math.abs(Math.abs(z.m)-1)<1e-8?'等大':Math.abs(z.m)>1?'放大':'縮小'}`;
        info=read('焦距 f',`${f} cm`)+read('像距 v',z.infinity?'趨向無窮遠':`${num(z.v)} cm`)+read('放大率 m',z.infinity?'不適用':num(z.m,2))+read('成像性質',property);explain='薄透鏡模型：1/f = 1/u + 1/v，m = −v/u。凸透鏡 f 為正，凹透鏡 f 為負；v > 0 是透鏡另一側的實像，v < 0 是物體同側的虛像。青色光線平行主軸入射後通過像方焦點（凹透鏡則反向延長通過物方焦點）；粉色光線通過光心不偏折。畫面會自動縮放。';
      } else {
        const {r,g,b}=state;
        art=`<rect x="35" y="30" width="550" height="430" rx="22" fill="#05080d"/><g style="isolation:isolate"><circle cx="255" cy="195" r="130" fill="rgb(${r},0,0)"/><circle cx="385" cy="195" r="130" fill="rgb(0,${g},0)" style="mix-blend-mode:screen"/><circle cx="320" cy="307" r="130" fill="rgb(0,0,${b})" style="mix-blend-mode:screen"/></g>`+text(225,65,'R 紅光',C.ink,22,'middle')+text(435,65,'G 綠光',C.ink,22,'middle')+text(320,455,'B 藍光',C.ink,22,'middle')+`<rect x="625" y="95" width="220" height="190" rx="20" fill="rgb(${r},${g},${b})" stroke="#9fb3c7"/>`+text(735,60,'三束光重疊的顏色',C.ink,21,'middle')+text(735,320,`RGB (${r}, ${g}, ${b})`,C.ink,20,'middle')+text(735,365,'紅 + 綠 = 黃',C.muted,19,'middle')+text(735,399,'綠 + 藍 = 青',C.muted,19,'middle')+text(735,433,'紅 + 藍 = 洋紅',C.muted,19,'middle');
        info=read('紅色色值比例',`${Math.round(r/255*100)}%`)+read('綠色色值比例',`${Math.round(g/255*100)}%`)+read('藍色色值比例',`${Math.round(b/255*100)}%`)+read('混色方式','光的加色法');explain='把三束光投在同一個白色屏幕上，重疊處做加色混合。此處 RGB 數值是螢幕示意值，並非光功率量測。等強度紅、綠、藍光在本模型中形成白色；全關則黑。白光也可含多種波長，通過稜鏡後會因各波長折射程度不同而色散成光譜。這裡不是顏料混色。';
      }
      drawing.innerHTML=svg(art,{shadow:'點光源、直線傳播與屏幕上的影子',mirror:'平面鏡成像與反射光線',refraction:'法線、入射光、反射光及折射光',lens:'透鏡主光線與物像位置',color:'紅綠藍光加色混合'}[topic]);reads.innerHTML=info;note.textContent=explain;
    }
    function onInput(e){const k=e.target.dataset.key;if(!k)return;state[k]=+e.target.value;render();}
    function onClick(e){const p=e.target.closest('[data-preset]'),c=e.target.closest('[data-color]');if(p){state.type=1;state.u=state.f*+p.dataset.preset;if(state.u>360)state.u=360;render();}if(c){const presets={white:[255,255,255],yellow:[255,255,0],cyan:[0,255,255],magenta:[255,0,255],off:[0,0,0]};[state.r,state.g,state.b]=presets[c.dataset.color];render();}}
    host.addEventListener('input',onInput);host.addEventListener('change',onInput);host.addEventListener('click',onClick);render();
    return ()=>{host.removeEventListener('input',onInput);host.removeEventListener('change',onInput);host.removeEventListener('click',onClick);};
  }
  window.OpticsLab={mount,math:{snell,lens,shadow}};
})();
</script><script>'use strict';
const TOPICS={
shadow:{name:'光的直進與影子',icon:'◭',group:2,n:'07',subtitle:'移動光源和遮光物，讓影子的大小告訴你光怎麼走。',prompt:'把手往手電筒靠近，牆上的影子會放大還是縮小？可以用直線解釋嗎？',take:'同一均勻介質中，光沿直線傳播。點光源模型下，影子大小由距離比例決定。'},
measure:{name:'測量與估讀',icon:'⌖',group:1,n:'01',subtitle:'刻度不是答案：移動物件、切換尺規，練習把測量寫完整。',prompt:'同一個物件，換一把刻度更細的尺，記錄的位數為什麼可能改變？',take:'測量值包含數值與單位。估讀不是亂猜，而是在最小刻度之間做合理判斷。'},
density:{name:'密度與浮沉',icon:'▧',group:1,n:'02',subtitle:'質量與體積一起看，才知道物體為什麼浮起來。',prompt:'把同一種材料切成兩半，質量變小了，密度也會變小嗎？',take:'密度是質量除以體積；均勻物體在同一液體中的浮沉，取決於平均密度的比較。'},
matter:{name:'物質與粒子',icon:'⠿',group:1,n:'03',subtitle:'從粒子種類與組合，分清元素、化合物和混合物。',prompt:'氧氣的每個分子有兩顆原子，為什麼仍然是元素？空氣又為什麼不是化合物？',take:'元素看原子種類，純物質看物質種類。「顆數多」不等於「種類多」。'},
solution:{name:'水溶液與溶解度',icon:'◒',group:1,n:'04',subtitle:'加更多溶質，不一定全溶解；分清投入量、溶解量與濃度。',prompt:'飽和後再加固體，杯底的固體變多，上層溶液濃度一定變大嗎？',take:'質量百分濃度的分母是溶液質量，不含未溶固體。固定溫度下，飽和濃度固定。'},
wave:{name:'波動與波速',icon:'∿',group:1,n:'05',subtitle:'看波形向前走，也看介質的一個點到底怎麼動。',prompt:'波往右前進，標記的介質點也會一路跟著往右嗎？固定波速時，頻率加倍會怎樣？',take:'波傳遞能量；此橫波模型的介質點只上下振動。波速 v＝fλ。'},
sound:{name:'聲音與回聲',icon:'◖',group:1,n:'06',subtitle:'用疏密波看聲音，用往返路程理解回聲。',prompt:'聽到回聲經過0.6秒，聲音走的是你到牆壁的距離，還是兩倍？',take:'聲音在空氣中是縱波。音調主要對應頻率，響度與振幅等因素有關；回聲路程是往返。'},
mirror:{name:'反射與平面鏡',icon:'◱',group:2,n:'08',subtitle:'讓光線說明：看似在鏡後的影像，光真的走到那裡了嗎？',prompt:'物體朝鏡面靠近10公分，物體和像之間的距離會縮短多少？',take:'平面鏡像與物體等大、正立；物距等於像距。鏡後延長線的交點是虛像。'},
refraction:{name:'折射與全反射',icon:'⌁',group:2,n:'09',subtitle:'拖動入射角，觀察光穿過兩種介質時的方向改變。',prompt:'光進入水中一定偏折嗎？從水到空氣時，入射角一直加大，又會發生什麼事？',take:'角度從法線量起。垂直入射方向不變；由高折射率到低折射率，才可能全反射。'},
lens:{name:'透鏡與成像',icon:'◠',group:2,n:'10',subtitle:'把物體移過焦點，看實像、虛像與大小如何一起改變。',prompt:'凸透鏡一定把物體放大嗎？物體放在焦點上時，為什麼接不到有限距離的清晰像？',take:'先畫光路，再說明成像。凸透鏡的成像取決於物距；凹透鏡對實物形成正立縮小虛像。'},
color:{name:'光與顏色',icon:'◉',group:2,n:'11',subtitle:'疊加紅、綠、藍光，看看「混在一起」為什麼可以變亮。',prompt:'紅光加綠光為什麼可以看到黃光？這跟把紅、綠顏料混合一樣嗎？',take:'光的加色與顏料的減色不同。螢幕上的RGB混光是色彩示意，不是光譜儀。'}
};
const lab=document.getElementById('lab'); let cleanup=()=>{},current='lens';
const C={green:'#19766a',orange:'#df7c44',blue:'#4c85bb',ink:'#163b40',muted:'#668083',light:'#d8eddf'};
const range=(id,label,min,max,value,step=1,unit='')=>`<div class="control"><label for="${id}">${label}<output id="${id}-value">${value} ${unit}</output></label><input id="${id}" type="range" min="${min}" max="${max}" value="${value}" step="${step}" data-unit="${unit}"></div>`;
const choose=(id,label,items)=>`<div class="control"><label for="${id}">${label}</label><select id="${id}">${items.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`;
const question=(q,a)=>`<section class="question"><h3>先猜，再操作</h3><p>${q}</p><details><summary>展開解釋</summary><div class="answer">${a}</div></details></section>`;
const text=(x,y,t,size=18,color=C.ink,extra='')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${color}" ${extra}>${t}</text>`;
const line=(x1,y1,x2,y2,color=C.ink,width=2,extra='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${extra}/>`;
function frame(title,controls,q,a){lab.innerHTML=`<div class="sim-layout"><div class="viz-panel"><div class="viz-heading"><span><i class="live-dot"></i>${title}</span><span>INTERACTIVE LAB</span></div><svg id="scene" viewBox="0 0 900 500" role="img" aria-label="${title}"></svg><div id="legend" class="legend"></div></div><div class="controls"><h3>改變條件，觀察結果</h3>${controls}<div id="readouts" class="readouts"></div><div id="sim-note" class="note"></div></div></div>${question(q,a)}`;}
const val=id=>Number(document.getElementById(id).value);
const select=id=>document.getElementById(id).value;
const draw=html=>document.getElementById('scene').innerHTML=html;
const readouts=items=>document.getElementById('readouts').innerHTML=items.map(([a,b])=>`<div class="readout">${a}<b>${b}</b></div>`).join('');
const note=html=>document.getElementById('sim-note').innerHTML=html;
function bind(fn){lab.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>{const out=document.getElementById(el.id+'-value');if(out)out.textContent=el.value+' '+(el.dataset.unit||'');fn();}));fn();}
function mountMeasure(){frame('讀尺練習 · 零點對齊',range('length','物件長度',1,9,5.34,.01,'cm')+choose('step','最小刻度',[['1','1 cm'],['0.1','0.1 cm（1 mm）']])+`<button id="measure-answer" class="btn primary">顯示參考讀值</button>`, '最小刻度為0.1 cm的尺，量到5.34 cm，最後一位代表什麼？','4是估讀位。實際估讀會有合理差異，不是精準知道物體的每一位數；本模型顯示值用於練習記錄位數。');let show=false;function render(){const l=val('length'),s=val('step'),digits=s===1?1:2;let h=`<rect x="85" y="246" width="720" height="108" rx="6" fill="#eadbb7" stroke="#c8b88c"/>`;for(let n=0;n<=10/s;n++){let x=100+n*s*68,major=Math.abs(n*s-Math.round(n*s))<.001;h+=line(x,248,x,major?287:272,'#71684e',major?2:1);if(major)h+=text(x,317,Math.round(n*s),18,'#71684e','text-anchor="middle"');}h+=`<rect x="100" y="189" width="${l*68}" height="39" rx="4" fill="${C.green}"/><path d="M${100+l*68} 179V358" stroke="${C.orange}" stroke-width="2" stroke-dasharray="5 5"/>`;h+=text(100,162,'零點對齊',18,C.muted)+text(790,385,'cm',18,C.muted)+text(450,425,show?`參考讀值：${l.toFixed(digits)} cm`:'先讀尺，再按「顯示參考讀值」',24,C.ink,'text-anchor="middle"');draw(h);readouts([['最小刻度',s+' cm'],['估讀到',s===1?'0.1 cm':'0.01 cm']]);note('此為連續刻度尺的理想模型。滑桿數值是設定值；<b>測量記錄</b>的位數依尺規精度決定。');}bind(render);document.getElementById('measure-answer').onclick=()=>{show=!show;document.getElementById('measure-answer').textContent=show?'隱藏參考讀值':'顯示參考讀值';render();};}
function mountDensity(){frame('質量 ÷ 體積 · 預測浮沉',range('mass','物體質量',10,600,120,5,'g')+range('volume','物體體積',20,300,200,5,'cm³')+range('liquid','液體密度',.5,1.5,1,.05,'g/cm³'), '同一物體放進密度較大的液體，漂浮時露出水面的比例會如何變化？','漂浮時，浮力等於重力。液體密度越大，只要排開較少液體便能平衡，因此浸入比例變小。這裡把物體視為不吸水、均勻且不溶解的剛體。');bind(()=>{let m=val('mass'),v=val('volume'),r=val('liquid'),rho=m/v,ratio=Math.min(rho/r,1),size=75*Math.cbrt(v/100),surface=205,bottom=420,y=rho<r?surface-size*(1-ratio):rho===r?270:bottom-size;let h=`<path d="M230 90V425H670V90" fill="none" stroke="#9bb5b1" stroke-width="5"/><path d="M233 ${surface}H667V422H233Z" fill="#d7e9eb"/>${line(233,surface,667,surface,C.blue,3)}<rect x="${450-size/2}" y="${y}" width="${size}" height="${size}" rx="4" fill="${C.orange}" opacity=".86" stroke="#aa5d32" stroke-width="2"/>`;h+=text(250,170,'液面',18,C.blue)+text(450,62,rho<r?'漂浮':Math.abs(rho-r)<1e-8?'懸浮（理想中性浮力）':'下沉至底部',26,C.ink,'text-anchor="middle"')+text(450,474,'示意圖：容器視為足夠大，液面高度固定',14,C.muted,'text-anchor="middle"');draw(h);readouts([['物體密度',rho.toFixed(2)+' g/cm³'],['密度比較',rho<r?'物體 ＜ 液體':Math.abs(rho-r)<1e-8?'物體 ＝ 液體':'物體 ＞ 液體'],['漂浮浸入比例',rho<r?(ratio*100).toFixed(0)+'%':'—']]);note(`<b>ρ＝m/V</b><br>${m} ÷ ${v}＝${rho.toFixed(2)} g/cm³。${rho<r?'漂浮時浸入體積比＝物體密度／液體密度。':'沉底時還有底部支持力；不能說此時浮力等於重力。'}`);});}
function mountMatter(){frame('粒子模型 · 種類比顆數重要',choose('substance','選擇樣本',[['element','氧氣 O₂：元素'],['compound','水 H₂O：化合物'],['mix','氧氣＋氮氣：混合物'],['mix2','水＋氧氣：混合物']])+`<div class="control"><label><input type="checkbox" id="labels" checked> 顯示粒子標記</label></div>`, '把很多顆相同的水分子放在一起，會不會變成混合物？','不會。相同種類的水分子構成純物質；水分子內含氫、氧兩種元素，所以水是化合物。純物質與元素不是同一層次的分類。');bind(()=>{let type=select('substance'),labels=document.getElementById('labels').checked,h=`<rect x="150" y="80" width="600" height="330" rx="30" fill="#fff" stroke="#b9cec2" stroke-width="2"/>`;const atom=(x,y,r,c,t)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>${labels?text(x,y+6,t,16,'#fff','text-anchor="middle"'):''}`;for(let i=0;i<12;i++){let x=220+(i%4)*147,y=146+Math.floor(i/4)*105,isWater=type==='compound'||type==='mix2'&&i%2===0,isN=type==='mix'&&i%2===0;if(isWater){h+=line(x,y,x-26,y+25,'#96aba4',6)+line(x,y,x+26,y+25,'#96aba4',6)+atom(x,y,19,C.orange,'O')+atom(x-26,y+25,12,C.blue,'H')+atom(x+26,y+25,12,C.blue,'H');}else{let c=isN?C.green:C.orange,t=isN?'N':'O';h+=line(x-15,y,x+15,y,c,8)+atom(x-18,y,19,c,t)+atom(x+18,y,19,c,t);}}h+=text(450,455,'球代表原子；連線代表原子間的鍵結',16,C.muted,'text-anchor="middle"');draw(h);readouts([['物質種類',type.startsWith('mix')?'2 種':'1 種'],['分類',type.startsWith('mix')?'混合物':'純物質'],['元素種類',type==='element'?'1 種':'2 種']]);note('這是<b>分子型物質</b>的簡化粒子圖。不同顏色區分元素，不代表原子真實顏色、大小比例或運動軌跡；並非所有物質都由獨立分子組成。');});}
function mountSolution(){frame('溶解量有限 · 質量仍守恆',range('water','水的質量',50,250,100,10,'g')+range('solute','加入溶質',0,150,30,1,'g')+range('solubility','此溫度下溶解度',10,100,36,1,'g / 100 g 水'), '100 g水最多能溶36 g某溶質，加入50 g後，溶液濃度是50/150嗎？','不是。只有36 g溶解，14 g在杯底；溶液質量＝100＋36＝136 g，質量百分濃度＝36/136×100% ≈26.47%。未溶固體不算進溶液質量。');bind(()=>{let w=val('water'),s=val('solute'),sol=val('solubility'),cap=w*sol/100,d=Math.min(cap,s),left=s-d,pct=d/(w+d)*100,level=365-w*.65;let h=`<path d="M280 80V415Q280 425 295 425H605Q620 425 620 415V80" fill="none" stroke="#9fb4b0" stroke-width="5"/><rect x="284" y="${level}" width="332" height="${420-level}" fill="${C.blue}" opacity="${.10+pct/150}"/>${line(284,level,616,level,C.blue,2)}`;for(let i=0;i<Math.min(40,Math.round(d));i++){let x=306+(i*83%289),y=level+18+(i*47%Math.max(20,390-level));h+=`<circle cx="${x}" cy="${y}" r="5" fill="${C.green}" opacity=".5"/>`;}for(let i=0;i<Math.min(30,Math.ceil(left/2));i++)h+=`<rect x="${302+i*39%284}" y="${408-Math.floor(i/8)*9}" width="9" height="9" fill="${C.orange}" rx="2"/>`;h+=text(450,50,s>=cap?'飽和溶液':'未飽和溶液',25,C.ink,'text-anchor="middle"')+text(660,level+40,'已溶解',17,C.green)+text(660,level+65,d.toFixed(1)+' g',20,C.green)+text(660,390,'未溶固體',17,C.orange)+text(660,417,left.toFixed(1)+' g',20,C.orange)+text(450,477,'小點代表溶質分散，不表示真實粒徑或體積加成',14,C.muted,'text-anchor="middle"');draw(h);readouts([['溶液質量',(w+d).toFixed(1)+' g'],['質量百分濃度',pct.toFixed(2)+'%'],['最大溶解量',cap.toFixed(1)+' g']]);note('溶解度是<b>指定溫度</b>下，每100 g水能溶的最大溶質質量。滑桿是抽象物質參數，不暗示所有物質升溫都更易溶。液面僅示意。');});}
function mountWave(){frame('橫波模型 · 能量前進，介質振動',range('freq','頻率 f',.5,4,1,.1,'Hz')+range('speed','波速 v',1,6,3,.1,'m/s')+range('amp','振幅 A',.1,.8,.4,.05,'m')+`<button class="btn primary" id="play">暫停動畫</button>`, '保持波速不变，把頻率加倍，波長會變成多少？','由v＝fλ可知，波速不變時頻率加倍，波長減半。振幅控制介質振動的最大位移，不直接决定此模型的波速。');let t=0,last=0,run=!matchMedia('(prefers-reduced-motion: reduce)').matches,raf;function render(){let f=val('freq'),v=val('speed'),a=val('amp'),wl=v/f,scale=75,mid=255,h='';for(let x=80;x<=830;x+=75){h+=line(x,95,x,410,'#dfe8df',1);h+=text(x,442,((x-80)/scale).toFixed(0),14,C.muted,'text-anchor="middle"');}h+=line(80,mid,830,mid,'#abc1b5',2);let path='';for(let x=80;x<=830;x+=2){let xx=(x-80)/scale,y=mid-a*120*Math.sin(2*Math.PI*(xx/wl-f*t));path+=(x===80?'M':'L')+x+' '+y;}h+=`<path d="${path}" fill="none" stroke="${C.green}" stroke-width="4"/>`;let xx=4,px=80+xx*scale,py=mid-a*120*Math.sin(2*Math.PI*(xx/wl-f*t));h+=line(px,130,px,380,C.orange,1,'stroke-dasharray="4 5"')+`<circle cx="${px}" cy="${py}" r="9" fill="${C.orange}" stroke="#fff" stroke-width="3"/>`+text(px,115,'追蹤這一個介質點',17,C.orange,'text-anchor="middle"')+text(755,67,'波向右 →',18,C.green)+text(850,442,'m',14,C.muted)+text(450,484,'動畫時間與秒數一致；縱、橫軸採不同繪圖比例',13,C.muted,'text-anchor="middle"');draw(h);readouts([['波長 λ',wl.toFixed(2)+' m'],['週期 T',(1/f).toFixed(2)+' s'],['波速 v',v.toFixed(1)+' m/s']]);note('<b>λ＝v/f，T＝1/f</b><br>橘點只有上下位移，沒有隨波向右移動。這是理想單一頻率橫波，不能直接當作空氣中聲波的振動方向。');}bind(render);let btn=document.getElementById('play');btn.textContent=run?'暫停動畫':'播放動畫';btn.onclick=()=>{run=!run;btn.textContent=run?'暫停動畫':'播放動畫';};function loop(now){if(last&&run)t+=Math.min((now-last)/1000,.1);last=now;render();raf=requestAnimationFrame(loop);}raf=requestAnimationFrame(loop);return()=>cancelAnimationFrame(raf);}
function mountSound(){frame('空氣縱波與回聲 · 不播放聲音',range('pitch','聲音頻率',100,1000,400,50,'Hz')+range('loud','振動幅度示意',1,10,4,1,'格')+range('distance','人到牆壁距離',5,150,51,1,'m')+`<button class="btn primary" id="echo">播放回聲路徑</button>`, '人離牆51 m，聲速340 m/s，回聲往返要多久？','聲音走102 m，時間＝102/340＝0.30 s。距離＝聲速×往返時間÷2。本模型固定聲速340 m/s；真實聲速會隨溫度與介質而變。');let elapsed=null,last=0,slowTime=0,raf;function render(){let f=val('pitch'),a=val('loud'),d=val('distance'),wl=340/f,rt=2*d/340,phase=elapsed||0;let h=text(78,48,'縱波：粒子左右振動，形成疏密',20,C.ink);for(let j=0;j<5;j++)for(let i=0;i<51;i++){let x=80+i*14.6+a*1.1*Math.sin(i*(f*.00074)-2*Math.PI*(f/1000)*slowTime);h+=`<circle cx="${x}" cy="${93+j*19}" r="3.6" fill="${i===25?C.orange:C.green}" opacity="${i===25?1:.5}"/>`;}h+=text(450,212,'上圖振動時間放慢1000倍；空間尺度僅供比較疏密',13,C.muted,'text-anchor="middle"')+line(80,270,820,270,'#dce5df',1)+`<circle cx="140" cy="330" r="18" fill="${C.green}"/><path d="M140 348V400M140 370L114 384M140 370L166 384M140 400L120 430M140 400L160 430" stroke="${C.green}" stroke-width="5"/><rect x="756" y="300" width="25" height="140" fill="#b0c1b6"/>`+line(175,438,745,438,C.muted,1)+text(450,464,`單程 ${d} m · 往返 ${2*d} m`,17,C.ink,'text-anchor="middle"');if(elapsed!==null){let fraction=Math.min(elapsed/2,1),pos=fraction<.5?fraction*2:2-fraction*2,x=175+pos*570;h+=`<circle cx="${x}" cy="360" r="12" fill="${C.orange}"/>`+text(450,294,fraction<.5?'去程 →':'← 回程',18,C.orange,'text-anchor="middle"');if(fraction===1)h+=text(450,400,'回聲抵達',22,C.orange,'text-anchor="middle"');}draw(h);readouts([['音調對應頻率',f+' Hz'],['實際波長',wl.toFixed(2)+' m'],['回聲往返時間',rt.toFixed(3)+' s']]);note('路徑動畫統一用<b>2秒展示</b>，實際時間看上方數值。為避免教室突然出聲，本頁不發聲；振幅滑桿只改變粒子位移示意，不是分貝刻度。');}bind(render);document.getElementById('echo').onclick=()=>{elapsed=0;last=0;};function loop(now){const dt=last?Math.min((now-last)/1000,.1):0;slowTime+=dt;if(elapsed!==null&&elapsed<2)elapsed=Math.min(2,elapsed+dt);render();last=now;raf=requestAnimationFrame(loop);}render();raf=requestAnimationFrame(loop);return()=>cancelAnimationFrame(raf);}
const mounts={measure:mountMeasure,density:mountDensity,matter:mountMatter,solution:mountSolution,wave:mountWave,sound:mountSound};
function activate(key){if(!TOPICS[key])key='lens';cleanup();current=key;let t=TOPICS[key];document.querySelectorAll('nav a').forEach(a=>{a.classList.toggle('active',a.dataset.key===key);if(a.dataset.key===key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.getElementById('eyebrow').textContent=t.group===1?'第一次段考複習 / MEASUREMENT · MATTER · WAVES':'第二次段考預備（範圍待公告）/ LIGHT & OPTICS';document.getElementById('title').textContent=t.name;document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('lesson-number').textContent=t.n;document.getElementById('teacher-prompt').textContent=t.prompt;document.getElementById('takeaway').textContent=t.take;cleanup=t.group===2?(window.OpticsLab?window.OpticsLab.mount(lab,key):(()=>{lab.innerHTML='<p>光學模組尚未載入，請重新整理。</p>';})()):mounts[key]();if(typeof cleanup!=='function')cleanup=()=>{};document.title=t.name+'｜理化實驗室';}
let nav='';[1,2].forEach(g=>{nav+=`<div class="nav-group-label">${g===1?'第一次段考 · 複習':'第二次段考 · 光學'}${g===2?'<b>優先備課</b>':''}</div>`;Object.entries(TOPICS).filter(([,t])=>t.group===g).sort((a,b)=>+a[1].n-+b[1].n).forEach(([key,t])=>{nav+=`<a href="#${key}" data-key="${key}"><span class="nav-icon" aria-hidden="true">${t.icon}</span>${t.name}<span class="count">${t.n}</span></a>`;});});document.getElementById('nav').innerHTML=nav;
window.addEventListener('hashchange',()=>activate(location.hash.slice(1)));document.getElementById('reset').onclick=()=>activate(current);document.getElementById('focus').onclick=()=>{let b=document.body.classList.toggle('projection');document.getElementById('focus').textContent=b?'結束投影':'投影模式';};
const dialog=document.getElementById('info');dialog.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
const openInfo=html=>{document.getElementById('info-content').innerHTML=html;dialog.showModal();};
document.getElementById('guide').onclick=()=>openInfo(`<div class="eyebrow">CLASSROOM GUIDE</div><h2>先讓學生猜，再讓光線回答。</h2><p>適合教師投影示範，也適合學生用自己的瀏覽器操作。先選一個問題，暫時不要展開解釋。</p><ol><li><b>1分鐘預測：</b>只改一項條件，請學生說出預期結果與理由。</li><li><b>3分鐘操作：</b>拖動滑桿，挑兩個反例。例如凸透鏡不一定放大。</li><li><b>2分鐘解釋：</b>用圖和數值解釋，再展開參考答案，比對推理。</li></ol><h3>推薦光學教學路線</h3><p>光的直進與影子 → 平面鏡 → 折射 → 凸／凹透鏡 → RGB光色。初學先看光路，熟悉後才使用公式；折射率與透鏡公式可視班級程度當教師補充。</p><h3>在教室使用</h3><p>按「投影模式」放大操作區。若教室網路不穩，可先下載離線版，雙擊HTML即可使用。離線檔包含互動程式，不需安裝、不需帳號，也不記錄學生個資。</p><h3>範圍提醒</h3><p>第一次範圍已核實為115學年度翰林B3 Ch1～Ch3；第二次光學依去年進度預備，今年仍以老師指定範圍為準。此站是原創教學工具，不是校方公告。</p>`);
document.getElementById('sources').onclick=()=>openInfo(`<div class="eyebrow">SCOPE & MODELS</div><h2>哪些已確認？哪些是教學模型？</h2><p>截至2026/10/11，校方115學年度第一學期行事曆列第一次段考為10/5–10/6、第二次為11/25–11/26。<a href="https://www.thsh.tp.edu.tw/uploads/178591837953198rrnVIS.pdf" target="_blank" rel="noopener">查看校方行事曆</a>。</p><p>已查到今年正式附件：<a href="https://www.thsh.tp.edu.tw/uploads/17902147214252um1mhto.pdf" target="_blank" rel="noopener">115學年度第一次段考範圍，第5頁</a>列八年級理化「翰林 B3 Ch1～Ch3」。第二次今年尚未查到公告，光學預備依<a href="https://www.thsh.tp.edu.tw/uploads/1763512990199UYTfRHNp.pdf" target="_blank" rel="noopener">114學年度第二次修正版，第5頁</a>的B3 4-1～4-5；不可視為今年已確認範圍。</p><h3>模型邊界</h3><ul><li>測量、密度、溶液與波動採理想模型，忽略不影響本課概念的細節。</li><li>光路是幾何光學示意；透鏡採薄透鏡、近軸近似，不含像差或繞射。</li><li>實際光路用實線、反向延長線用虛線。虛像不能直接用屏幕承接。</li><li>折射與薄透鏡公式可作教師補充，不表示國中必須計算所有公式。</li><li>RGB滑桿是螢幕色彩值，不是精密光功率或顏料配比。</li></ul><h3>關於架設</h3><p>網站為純HTML、CSS、JavaScript，沒有後端或付費依賴。index.html是入口檔；GitHub Pages是靜態網站託管。GitHub Free使用Pages時來源儲存庫須公開，教材及原始碼也會公開，適合確認可公開後再部署。</p><p><a href="https://docs.github.com/en/pages/getting-started-with-github-pages/about-github-pages" target="_blank" rel="noopener">GitHub Pages官方說明</a></p>`);
